<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm your TrueDeal email</title></head>
  <body style="margin:0;background:#f5f5f5;color:#171717;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" style="width:100%;border-collapse:collapse;"><tr><td style="padding:32px 16px;">
      <table role="presentation" style="width:100%;max-width:560px;margin:auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:16px;"><tr><td style="padding:32px;">
        <p style="margin:0 0 28px;font-size:24px;font-weight:bold;">TrueDeal</p>
        <h1 style="font-size:24px;line-height:1.3;">Confirm your email</h1>
        <p style="font-size:16px;line-height:1.6;">Welcome to TrueDeal. Confirm your email address to finish setting up your account and start buying and selling.</p>
        <p style="margin:28px 0;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:14px 24px;border-radius:24px;background:#171717;color:#ffffff;text-decoration:none;font-weight:bold;">Confirm my email</a></p>
        <p style="font-size:14px;line-height:1.6;color:#525252;">If you didn't create a TrueDeal account, you can ignore this email. Never share your confirmation link.</p>
        <p style="margin-top:28px;font-size:14px;color:#737373;">The TrueDeal team</p>
      </td></tr></table>
    </td></tr></table>
  </body>
</html>
